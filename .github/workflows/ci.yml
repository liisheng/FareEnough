name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Backend and API integration tests
        if: ${{ !cancelled() && success() }}
        run: npm test
      - name: Frontend tests
        if: ${{ !cancelled() }}
        run: npm run test:frontend
      - name: Browser journeys
        if: ${{ !cancelled() }}
        run: npm run test:e2e
      - name: Policy fixture checks
        if: ${{ !cancelled() }}
        run: npm run eval:policy
      - name: Prompt regression inventory (no external calls)
        if: ${{ !cancelled() }}
        run: npm run eval:prompts
      - name: Save browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            .runtime/browser-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
